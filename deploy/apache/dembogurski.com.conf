Include /etc/apache2/dembogurski/database.conf

<VirtualHost *:80>
    ServerName dembogurski.com
    ServerAlias www.dembogurski.com
    DocumentRoot /www/dembogurski/portada

    ErrorLog ${APACHE_LOG_DIR}/dembogurski-error.log
    CustomLog ${APACHE_LOG_DIR}/dembogurski-access.log combined

    RedirectMatch 302 ^/arvore$ /arvore/
    Alias /arvore/ /www/dembogurski/artifacts/arvore-dembogurski/apache/

    <Directory /www/dembogurski/portada>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /www/dembogurski/artifacts/arvore-dembogurski/apache>
        Options -Indexes
        AllowOverride All
        AuthType Basic
        AuthName "Familia Dembogurski"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/dembogurski/users.htpasswd
        Require valid-user
    </Directory>
</VirtualHost>
