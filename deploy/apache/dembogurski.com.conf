Include /etc/apache2/dembogurski/database.conf

<VirtualHost *:80>
    ServerName dembogurski.com
    ServerAlias www.dembogurski.com
    DocumentRoot /var/www/dembogurski

    ErrorLog ${APACHE_LOG_DIR}/dembogurski-error.log
    CustomLog ${APACHE_LOG_DIR}/dembogurski-access.log combined

    <Directory /var/www/dembogurski>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/dembogurski/arvore>
        Options -Indexes
        AllowOverride All
        AuthType Basic
        AuthName "Familia Dembogurski"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/dembogurski/users.htpasswd
        Require valid-user
    </Directory>
</VirtualHost>
